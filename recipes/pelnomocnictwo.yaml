# Power of attorney (pełnomocnictwo). Output: schemas/pelnomocnictwo.json.
# First set of fields; T005 completes signatories and harder layouts.
class: pelnomocnictwo
description: Pełnomocnictwo do reprezentowania wykonawcy przed KIO
classify:
  min_score: 4
  margin: 1
  signals:
    - {pattern: "pelnomocnictw", weight: 3, head: 300, squash: true}
    - {pattern: "mocodaw", weight: 1}
    - {pattern: "ustanawiam|udzielam|upowazniam|umocowan", weight: 1}
    - {pattern: "pelnomocnik", weight: 1}
  forbidden:
    - {pattern: "see the notice on ted website|ogloszenie o zamowieniu lub ogloszenie o koncesji", head: 600}

fields:
  - path: mocodawca.data.nazwa
    strategies:
      - {use: regex, pattern: "mocodawc\\w*\\s+jest\\s+(?P<v>[^,\\n]+)"}
      - {use: regex, pattern: "^mocodawca:?[ \\t]+(?P<v>[^,\\n]+)$"}
      - {use: regex, pattern: "w imieniu\\s+(?P<v>[^(,\\n]+?)\\s*\\("}
    normalize: strip

  - path: mocodawca.data.krs
    strategies:
      - {use: regex, pattern: "krs\\D{0,30}?(?P<v>\\d{10})"}

  - path: mocodawca.data.nip
    strategies:
      - {use: regex, pattern: "nip:?\\s*(?P<v>\\d[\\d -]{8,12}\\d)"}
    normalize: digits
    validate: nip

  - path: mocodawca.data.typ
    strategies:
      - {use: derived, if_set: mocodawca.data.krs, value: osoba_prawna}

  - path: pelnomocnicy[].imie_nazwisko
    strategies:
      - {use: regex, all: true, pattern: "(?:r\\.\\s?pr\\.|adw\\.|radca prawny|adwokat(?![a-z]))\\s+(?P<v>[a-z]+\\s+[a-z-]+)"}
    normalize: strip
